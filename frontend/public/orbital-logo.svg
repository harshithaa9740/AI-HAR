<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="1" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="22" fill="#080d1a" />
  <rect width="100" height="100" rx="22" stroke="url(#orbitGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Outer Orbital Ring -->
  <ellipse cx="50" cy="50" rx="36" ry="14" transform="rotate(-30 50 50)" stroke="url(#orbitGrad)" stroke-width="2" stroke-dasharray="3 2" opacity="0.6" />

  <!-- Primary Orbital Path -->
  <ellipse cx="50" cy="50" rx="34" ry="13" transform="rotate(35 50 50)" stroke="url(#orbitGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Central Glow -->
  <circle cx="50" cy="50" r="18" fill="url(#coreGlow)" />

  <!-- Central Sensor Core -->
  <circle cx="50" cy="50" r="8" fill="#00e5ff" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />

  <!-- Orbiting Satellite Node -->
  <circle cx="78" cy="38" r="4" fill="#00e5ff" filter="url(#glow)" />
  <circle cx="22" cy="62" r="3" fill="#6366f1" />
</svg>
